purpose:
  stands_in_for: DSers MCP Streamable HTTP POST endpoint, with synthetic tool definitions and results
  unblocks: Repeatable node transport, pagination, SSE, error, and timeout verification without production credentials or writes
assumptions:
  - id: dsers-transport
    status: supported
    claim: The DSers endpoint uses JSON-RPC over Streamable HTTP; the client must initialize before discovering or calling tools.
    reason: The existing DSers MCP BFF registers a stateless StreamableHTTP server; earlier production verification records successful initialize, tools/list, and tools/call. This fixture additionally exercises session headers without claiming DSers requires a session.
    verification: Provider source and workspace production verification report reviewed on 2026-11-04. Node-specific HTTP simulation results are recorded in docs/VALIDATION.md after execution.
    source: DSers MCP BFF internal/server/mcp.go; workspace docs/investigations/2026-11-04-mcp-production-channel-e2e.md; tests/http.sim.cjs
    updated_at: '2026-11-04'
  - id: node-oauth-flow
    status: supported
    claim: The installed n8n version performs DCR, PKCE, token storage, and resource-bound refresh correctly for the custom DSers credential.
    reason: The credential extends n8n OAuth2 and enables its discovery flow. The synthetic fixture does not implement OAuth. Independent real-host acceptance established connected PKCE credentials, 60-tool discovery, successful account/store calls, and host-managed refresh after an injected invalid access token.
    verification: Read n8n OAuth service and public DSers authorization metadata on 2026-11-04. The installed host showed a connected PKCE credential and returned 60 tools in a real Get Many execution. Initial account/store reads failed with PLAN_RECORD_NOTFOUND; after account reconnection both succeeded through the actual n8n engine. An injected invalid local access token caused host-managed refresh, token persistence, and successful account/store reads. Resource and configured scope were unchanged. Raw browser PKCE traffic was not independently captured; see docs/VALIDATION.md for boundaries.
    source: credentials/DsersOAuth2Api.credentials.ts; nodes/Dsers/transport.ts; https://ai.dsers.com/.well-known/oauth-authorization-server
    updated_at: '2026-11-04'
  - id: missing-plan-record
    status: supported
    claim: A structured VALIDATION_ERROR with reason PLAN_RECORD_NOTFOUND is reported using fixed account-setup guidance without echoing upstream message or hint fields.
    reason: A real read-only attempt returned this reason before account/store business reads. The synthetic fixture preserves the error envelope shape without including account data.
    verification: npm run check passed 30 tests; npm run test:simulation passed 10 tests and observed 30 requests on 2026-11-04. The fixture does not establish successful real business access.
    source: nodes/Dsers/McpClient.ts; tests/mcp-client.test.cjs; tests/http.sim.cjs; docs/VALIDATION.md
    updated_at: '2026-11-04'
fingerprints:
  - id: initial-local-development
    date: '2026-11-04'
    commit: Initial implementation; see repository history for the source revision
    cli: Postman CLI 1.75.0
