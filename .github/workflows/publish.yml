name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const v = require("./package.json").version; if (process.env.GITHUB_EVENT_NAME === "workflow_dispatch" ? process.env.RELEASE_VERSION !== v : process.env.GITHUB_REF_NAME !== "v" + v) process.exit(1)'
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
